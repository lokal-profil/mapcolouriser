{% extends "base.html" %}
{% block content %}
    <p>
        <a href="{{ url_for('main.index') }}">&larr; Back to form</a>
    </p>
    <div class="actions">
        {# A link (it navigates to /download) wearing button styling — the
           Codex-sanctioned exception for high-emphasis actions. #}
        <a href="{{ url_for('main.download') }}" class="btn btn-primary btn-progressive">Download SVG</a>
    </div>
    <div class="preview">
        {{ svg | safe }}
    </div>
    <details class="result-legend" open>
        <summary>Wikitext legend</summary>
        <textarea id="legend-output" aria-label="Wikitext legend" readonly rows="{{ [legend.count('\n') + 1, 2] | max }}">{{ legend }}</textarea>
    </details>
{% endblock %}
